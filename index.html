<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 MusicHub — музыкальный поиск</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🎵</span>
                <span class="logo-text">Music<span class="highlight">Hub</span></span>
            </div>
            <div class="search-container">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Исполнитель, трек, альбом..." />
                    <button id="searchBtn">Найти</button>
                </div>
            </div>
            <div class="header-actions">
                <button id="themeToggle" title="Тема">🌙</button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main>
        <!-- Модальное окно (внутри страницы) -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Заголовок</h2>
                    <button id="modalClose" class="modal-close">✕</button>
                </div>
                <div id="modalBody" class="modal-body"></div>
            </div>
        </div>

        <!-- Секция результатов -->
        <section id="resultsSection">
            <div class="section-header">
                <h2 id="resultsTitle">🔥 Популярное</h2>
                <span id="resultsCount" class="results-count"></span>
            </div>
            <div id="tracksContainer" class="tracks-grid"></div>
        </section>

        <!-- Секция альбомов -->
        <section id="albumsSection">
            <div class="section-header">
                <h2>🎷 Альбомы</h2>
            </div>
            <div id="albumsContainer" class="albums-grid"></div>
        </section>

        <!-- Секция исполнителя (появляется при клике) -->
        <section id="artistSection" class="hidden">
            <div class="section-header">
                <button id="backToSearch" class="back-btn">← Назад</button>
                <h2 id="artistName">Исполнитель</h2>
            </div>
            <div id="artistInfo" class="artist-info"></div>
            <div id="artistTracks" class="tracks-grid"></div>
        </section>
    </main>

    <!-- Плеер -->
    <footer id="player" class="player">
        <div class="player-left">
            <img id="playerCover" class="player-cover" src="https://via.placeholder.com/60" alt="Cover" />
            <div class="player-track-info">
                <div id="playerTitle" class="player-title">Выберите трек</div>
                <div id="playerArtist" class="player-artist">Начните поиск</div>
            </div>
        </div>
        <div class="player-center">
            <div class="player-controls">
                <button id="prevBtn" class="control-btn" title="Предыдущий">⏮</button>
                <button id="playBtn" class="control-btn play-btn">▶</button>
                <button id="nextBtn" class="control-btn" title="Следующий">⏭</button>
            </div>
            <div class="player-progress">
                <span id="currentTime" class="time">0:00</span>
                <input type="range" id="progressBar" min="0" max="100" value="0" />
                <span id="totalTime" class="time">0:00</span>
            </div>
        </div>
        <div class="player-right">
            <button id="downloadTrackBtn" class="action-btn" title="Скачать трек">⬇</button>
            <button id="downloadPlaylistBtn" class="action-btn" title="Скачать плейлист">📋</button>
            <button id="showLyricsBtn" class="action-btn" title="Текст песни">📝</button>
        </div>
        <audio id="audioPlayer"></audio>
    </footer>

    <!-- Уведомления -->
    <div id="notification" class="notification hidden"></div>

    <script src="script.js"></script>
</body>
</html>
