<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - Поиск музыки</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo" id="logoLink">
                <span class="logo-icon">🎵</span>
                <span class="logo-text">Music<span class="highlight">Hub</span></span>
            </div>
            <div class="search-container">
                <div class="search-wrapper">
                    <span class="search-icon"></span>
                    <input type="text" id="searchInput" placeholder="Поиск треков, исполнителей, альбомов..." autocomplete="off">
                    <button id="searchBtn">Найти</button>
                </div>
                <div class="search-history" id="searchHistory"></div>
            </div>
            <div class="header-actions">
                <button id="themeToggle" title="Сменить тему"></button>
            </div>
        </div>
    </header>

    <main>
        <!-- Offline Error -->
        <div id="offlineError" class="offline-error hidden">
            <div class="offline-icon">😢</div>
            <h1>Ошибка 666</h1>
            <p>Адский сатана! Нет соединения с интернетом</p>
            <button onclick="window.location.reload()" class="retry-btn"> Попробовать снова</button>
        </div>

        <!-- Results Section -->
        <section id="resultsSection">
            <div class="section-header">
                <h2 id="resultsTitle">🔥 Популярное</h2>
                <span class="results-count" id="resultsCount">0 треков</span>
            </div>
            <div class="tracks-grid" id="tracksContainer"></div>
        </section>

        <!-- Albums Section -->
        <section id="albumsSection">
            <div class="section-header">
                <h2>🎷 Альбомы</h2>
            </div>
            <div class="albums-grid" id="albumsContainer"></div>
        </section>

        <!-- Artist Section (old) -->
        <section id="artistSection" class="hidden"></section>
    </main>

    <!-- Artist Page V2 -->
    <div id="artistPageV2" class="hidden"></div>

    <!-- Single Page V2 -->
    <div id="singlePageV2" class="hidden"></div>

    <!-- Modal -->
    <div class="modal hidden" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Заголовок</h2>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Player -->
    <div class="player">
        <div class="player-left">
            <img src="https://via.placeholder.com/60" alt="Cover" class="player-cover" id="playerCover">
            <div class="player-track-info">
                <div class="player-title" id="playerTitle">Выберите трек</div>
                <div class="player-artist" id="playerArtist">Начните поиск</div>
            </div>
        </div>
        <div class="player-center">
            <div class="player-controls">
                <button class="control-btn" id="prevBtn">⏮</button>
                <button class="control-btn play-btn" id="playBtn">▶</button>
                <button class="control-btn" id="nextBtn">⏭</button>
            </div>
            <div class="player-progress">
                <span class="time" id="currentTime">0:00</span>
                <input type="range" id="progressBar" min="0" max="100" value="0">
                <span class="time" id="totalTime">0:00</span>
            </div>
        </div>
        <div class="player-right">
            <button class="action-btn" id="downloadTrack" title="Скачать">⬇</button>
            <button class="action-btn" id="downloadPlaylist" title="Скачать плейлист"></button>
            <button class="action-btn" id="showLyrics" title="Текст">📝</button>
            <button class="action-btn" id="shareTrack" title="Поделиться"></button>
            <button class="action-btn" id="addToFavorites" title="В избранное">❤️</button>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>
    <div class="notification hidden" id="notification"></div>

    <script src="script.js"></script>
</body>
</html>
